name: tac-next

on:
  pull_request:
    paths:
      - "tac-next/**"
      - ".github/workflows/tac-next.yml"
  push:
    branches: [main]
    paths:
      - "tac-next/**"

defaults:
  run:
    working-directory: tac-next

jobs:
  check:
    name: tac-next (lint + typecheck + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: tac-next/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: tac-next/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: critical invariant suite (docs/CRITICAL_INVARIANTS.md)
        run: pnpm test:critical
      - name: critical mutant smoke (safety rules must be test-protected)
        run: pnpm test:mutation
      - run: pnpm build
      - name: dependency audit
        run: pnpm audit --audit-level high

  postgres:
    name: tac-next (real PostgreSQL concurrency)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          # CI 専用の使い捨て DB（本番の値ではない）
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tac_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/tac_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: tac-next/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: tac-next/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: concurrency on real PostgreSQL (org lock / unique constraints / pooled tenant context)
        run: pnpm test:postgres

  e2e:
    name: tac-next (e2e, Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: tac-next/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: tac-next/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: install chromium for Playwright
        run: pnpm --filter @tac/web exec playwright install --with-deps chromium
      - name: e2e (API with PGlite + mock telephony simulator, no real calls)
        run: pnpm test:e2e
